name: Publicar preview no GitHub Pages

on:
  push:
    branches: [main, claude/jolly-dijkstra-fohou9]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: camaleao3d
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: camaleao3d/package-lock.json

      - run: npm ci

      # A rota de API (/api/reclamacao) precisa de servidor e não existe em
      # export estático. Ela é removida só nesta cópia efêmera do runner,
      # nunca no repositório — a versão real (Vercel/Hostinger) mantém a API.
      - run: rm -rf app/api

      - run: npm run build
        env:
          GITHUB_PAGES: 'true'

      - uses: actions/upload-pages-artifact@v3
        with:
          path: camaleao3d/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
